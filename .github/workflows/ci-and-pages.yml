name: Verify and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also publish to GitHub Pages (only works once Pages is enabled for this repo)'
        type: boolean
        default: false

# Least privilege. The id-token grant is only needed by the deploy job.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs: typecheck, the data-model self test, a production build, and a
  # headless-browser smoke test of the built bundle.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Data-model self test
        run: npm run selftest

      # BASE_PATH is derived from GITHUB_REPOSITORY by vite.config.ts, so the
      # bundle is prefixed for https://<owner>.github.io/<repo>/.
      - name: Production build
        run: npm run build

      # The smoke suite serves the built bundle, drives it in headless Chromium
      # over the DevTools protocol, exercises every mode, fails on any console
      # or page error, checks the phone layout, and writes screenshots to
      # smoke-out/. It is a required check: it is the only thing that verifies
      # the WebGL scene renders and that the panels actually compose.
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Browser smoke test
        run: npm run smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-out/
          retention-days: 14

  # Publishing is opt-in. Pages is not enabled on this repository, and
  # actions/configure-pages fails hard when it is not, so the packaging and
  # deploy steps only run on a manual dispatch that asks for them. That keeps
  # pushes green while Pages is off, and publishing stays a deliberate action.
  package:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4